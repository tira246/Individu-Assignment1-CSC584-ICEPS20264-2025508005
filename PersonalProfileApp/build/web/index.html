<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Profile Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        
        <style>
            body {
                font-family: 'Poppins', sans-serif;
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                min-height: 100vh;
            }
            .custom-card {
                border-radius: 15px;
                border: none;
            }
        </style>
    </head>
    <body>

        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-8 col-md-10 col-12">
                    <div class="card shadow custom-card">
                        <div class="card-header bg-primary text-white text-center py-3">
                            <h4 class="mb-0"><i class="fas fa-user-graduate me-2"></i>Student Profile Form</h4>
                        </div>
                        <div class="card-body p-4">
                            
                            <form action="ProfileServlet" method="POST">
                                <div class="mb-3">
                                    <label class="form-label"><i class="fas fa-user text-primary me-2"></i>Name:</label>
                                    <input type="text" class="form-control" name="name" placeholder="Enter your full name" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label"><i class="fas fa-id-card text-primary me-2"></i>Student ID:</label>
                                    <input type="text" class="form-control" name="studentId" placeholder="e.g. 2025123456" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label"><i class="fas fa-graduation-cap text-primary me-2"></i>Program:</label>
                                    <input type="text" class="form-control" name="program" placeholder="e.g. CS240" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label"><i class="fas fa-envelope text-primary me-2"></i>Email:</label>
                                    <input type="email" class="form-control" name="email" placeholder="name@student.uitm.edu.my" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label"><i class="fas fa-heart text-danger me-2"></i>Hobbies:</label>
                                    <input type="text" class="form-control" name="hobbies" placeholder="e.g. Reading, Coding" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label"><i class="fas fa-comment-dots text-success me-2"></i>Short Self-Introduction:</label>
                                    <textarea class="form-control" name="intro" rows="3" placeholder="Tell a bit about yourself..." required></textarea>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2">
                                    <i class="fas fa-paper-plane me-2"></i>Submit Profile
                                </button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
